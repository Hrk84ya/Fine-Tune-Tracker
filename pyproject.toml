[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finetune-tracker"
version = "0.1.0"
description = "A lightweight, self-hosted fine-tuning run tracker for ML engineers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fine-tune Tracker" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "apscheduler>=3.10",
    "dash>=2.16",
    "plotly>=5.20",
    "pandas>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
]
hf = [
    "transformers>=4.40",
]

[tool.hatch.build.targets.wheel]
packages = ["finetune_tracker", "backend", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["backend/routers"]
